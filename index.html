<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>บัญชีงานแต่ง | Wedding Planner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap');
:root{--bg:#f7f7fb;--card:#fff;--ink:#28283a;--mute:#77788e;--line:#e8e8f1;--pri:#a64d75;--pri-dark:#84375b;--pri2:#f8eaf1;--ok:#21845b;--ok-bg:#e7f7ef;--bad:#c2414b;--bad-bg:#fff0f0;--shadow:0 8px 24px rgba(43,34,64,.055);--shadow-hover:0 12px 28px rgba(43,34,64,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;background:radial-gradient(ellipse at top left,#fbf0f6 0,transparent 34%),var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
header{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 3px 18px rgba(43,34,64,.035)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(18px,calc((100vw - 1280px)/2));}.top b{color:var(--pri-dark);font-size:20px;font-weight:800;letter-spacing:-.3px}.top b:before{content:'WEDDING PLANNER';display:block;color:var(--mute);font-size:9px;letter-spacing:2px;font-weight:700;line-height:1.4;margin-bottom:2px}.top #st{padding:4px 10px;border-radius:20px;background:#f4f4f8}
nav{display:flex;gap:6px;padding:0 max(12px,calc((100vw - 1280px)/2)) 12px;overflow-x:auto;scrollbar-width:thin}nav button{border:1px solid transparent;background:transparent;padding:9px 16px;border-radius:12px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap;transition:all .18s ease}nav button:hover{background:#f7f2f6;color:var(--pri)}nav button.on{background:linear-gradient(135deg,var(--pri),#c36a91);color:#fff;box-shadow:0 5px 14px #a64d752c}
main{max-width:1320px;margin:0 auto;padding:26px 22px 40px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s,transform .2s}.card.clk:hover{box-shadow:var(--shadow-hover);border-color:#dfb5ca;transform:translateY(-2px)}.stat{position:relative;overflow:hidden;min-height:106px}.stat:after{content:'';position:absolute;width:72px;height:72px;right:-25px;top:-25px;border-radius:50%;background:var(--pri2);opacity:.8}.stat small{color:var(--mute);display:block;font-size:12px;font-weight:600;position:relative;z-index:1}.stat b{display:block;font-size:clamp(20px,2vw,25px);font-weight:800;letter-spacing:-.6px;margin-top:5px;overflow-wrap:anywhere;position:relative;z-index:1}
h3{margin:18px 0 10px;font-size:16px;font-weight:800;letter-spacing:-.2px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #f0eff5}.row:last-child{border:0}.row>span:first-child{min-width:0;overflow-wrap:anywhere}.mute{color:var(--mute);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:8px;background:#f3e9ef;border-radius:20px;overflow:hidden;margin:8px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a64d75,#d58bac);border-radius:20px;transition:width .3s}.bar.over i{background:linear-gradient(90deg,#c2414b,#f07d83)}
button{transition:all .16s ease}button.p{background:linear-gradient(135deg,var(--pri),#c36a91);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 10px #a64d751f}button.p:hover{filter:brightness(.96);transform:translateY(-1px);box-shadow:0 7px 16px #a64d7530}button.g{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;color:#5f6075}button.g:hover{border-color:#d9a8bf;background:#fff8fb;color:var(--pri-dark)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d9a8bf80;outline-offset:1px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:var(--pri2);color:var(--pri-dark);padding:4px 10px;border-radius:20px;white-space:nowrap}.tag.best{background:var(--ok-bg);color:var(--ok)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #dedee9;border-radius:10px;font:inherit;background:#fff;color:var(--ink);transition:border-color .16s,box-shadow .16s}input:hover,select:hover,textarea:hover{border-color:#c9c6d8}input:focus,select:focus,textarea:focus{border-color:#c17a9c;box-shadow:0 0 0 3px #a64d7512;outline:0}label{display:block;font-size:12px;color:#696a80;font-weight:700;margin:12px 0 5px}
.bd{position:fixed;inset:0;background:rgba(28,24,40,.48);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;animation:fadeIn .15s ease}.md{background:#fff;border:1px solid #ffffff80;border-radius:20px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow:auto;box-shadow:0 24px 80px #17132330;animation:riseIn .2s ease}.md>b{font-size:20px;font-weight:800;color:var(--pri-dark);display:block;margin-bottom:12px}
.bar2{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap}.bar2 h3{margin:0}.clk{cursor:pointer}.clk:hover{border-color:var(--pri)}table{width:100%;border-collapse:separate;border-spacing:0}td,th{padding:10px 9px;border-bottom:1px solid #eeedf4;text-align:left;font-size:13px}th{color:var(--mute);font-weight:700;font-size:11px;letter-spacing:.2px;background:#faf9fc}.r{text-align:right}.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.pt th{white-space:nowrap;background:#f8f5fa;padding:12px 10px;position:sticky;top:0}.pt td{padding:12px 10px;vertical-align:middle}.pt tr:last-child td{border-bottom:0}.pt tbody tr:hover,.pt tr:hover td{background:#fcf7fa}.pc{cursor:pointer;transition:background .15s}.pc:hover{background:var(--pri2)!important}.pc.e{color:#b7b5c4}.rg{color:var(--mute)}.low{color:#c23d61;font-weight:800}.wrap table select{min-width:112px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes riseIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:700px){.top{padding:12px 14px}.top b{font-size:18px}nav{padding:0 10px 10px}nav button{padding:8px 12px;font-size:13px}main{padding:18px 12px 28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px;border-radius:14px}.stat{min-height:94px}.stat b{font-size:19px}.bar2{align-items:stretch}.bar2>span{display:flex;gap:6px;flex-wrap:wrap}.bar2>button,.bar2>span button{font-size:12px}.md{padding:18px;border-radius:16px}td,th{padding:9px 7px}.top #st{font-size:11px}}
@media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.stat b{font-size:17px}.top b:before{letter-spacing:1.3px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="top"><b>💐 Chadahlia.studio</b><span class="mute" id="st"></span></div>
<nav id="nav"></nav></header>
<main id="app">กำลังโหลด...</main>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const PAGES=[['dash','📊 Dashboard'],['proj','💍 โปรเจ็ค'],['tx','🧾 รายการจัดซื้อ'],['price','🌸 ราคาสินค้า']];
const CATS=['ดอกไม้','ตกแต่ง/เวที','อาหาร/เครื่องดื่ม','ช่างภาพ/วิดีโอ','ดนตรี/MC','ชุด/แต่งหน้า','ขนส่ง','ค่าแรงทีมงาน','อื่นๆ'];
const ST=['Not Started','Processing','Done'],MAINS=['Backdrop','Dessert Table','Dinner Table','ผลไม้','ดอกไม้','จิปาถะ'];
const F={
 Projects:[['name','ชื่องาน'],['client','ลูกค้า'],['date','วันงาน','date'],['venue','สถานที่'],['budget','งบ/ค่าจ้างที่ได้รับ (บาท)','number'],['status','สถานะ','select',['รอดำเนินการ','กำลังดำเนินการ','เสร็จสิ้น','ยกเลิก']],['note','รายละเอียด','textarea']],
 Items:[['projectId','โปรเจ็ค','project'],['main','หมวดหลัก (เช่น Dinner Table, ดอกไม้)','main'],['name','รายการ'],['detail','รายละเอียด'],['qty','จำนวน','number'],['unit','หน่วย (เช่น เมตร, แพ็ค, ชิ้น)'],['price','ราคาต่อหน่วย','number'],['total','ราคารวม (ปล่อยว่าง = จำนวน × ราคา)','number'],['remark','หมายเหตุ'],['status','สถานะ','select',ST],['paid','จ่ายแล้ว (บาท)','number'],['image','ลิงก์รูป (ถ้ามี)']],
 Budgets:[['projectId','โปรเจ็ค','project'],['main','หมวด','main'],['amount','งบของหมวด (บาท)','number']],
 Transactions:[['date','วันที่รับเงิน','date'],['projectId','โปรเจ็ค','project'],['desc','รายการ (เช่น มัดจำงวด 1)'],['amount','จำนวนเงิน (บาท)','number']],
 Prices:[['item','ดอกไม้/สินค้า'],['color','สี/ประเภท'],['unit','หน่วย (เช่น มัด, ก้าน, ชิ้น)'],['shop','ร้าน'],['price','ราคา (บาท)','number'],['date','วันที่เช็คราคา','date'],['note','หมายเหตุ']]
};
let D={Projects:[],Transactions:[],Prices:[],Items:[],Budgets:[]},page='dash',pid=null,txf='',q='';
const N=x=>Number(x)||0,fmt=n=>N(n).toLocaleString('th-TH'),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((t,x)=>t+N(x.amount),0);
const pname=id=>(D.Projects.find(p=>p.id===id)||{}).name||'-';
const sk=(a,k)=>a.reduce((t,x)=>t+N(x[k]),0);
function stats(p){const it=D.Items.filter(x=>x.projectId===p.id),inc=D.Transactions.filter(x=>x.projectId===p.id&&x.type==='รายรับ'),total=sk(it,'total');return{it,inc,total,paid:sk(it,'paid'),rec:sk(inc,'amount'),spent:total,left:N(p.budget)-total}}
const API='https://script.google.com/macros/s/AKfycbyBSpa9_9s4wIMx3WavPO_sP7xSwlTi9fRS0XZGwfqt2VMnDltBDoOVexNrvXoUsbc8KQ/exec';
let KEY=localStorage.getItem('wk')||'';
async function api(action,p){
 if(!KEY)KEY=prompt('ใส่รหัสผ่านเข้าใช้งาน')||'';
 const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:KEY,action},p||{}))});
 const j=await res.json();
 if(!j.ok){if(/รหัสผ่าน/.test(j.error)){KEY='';localStorage.removeItem('wk')}throw new Error(j.error)}
 localStorage.setItem('wk',KEY);return j.data;
}
function run(fn,...a){$('#st').textContent='กำลังบันทึก...';api(fn,fn==='saveRow'?{sheet:a[0],row:a[1]}:{sheet:a[0],id:a[1]}).then(d=>{D=d;$('#st').textContent='';render()}).catch(e=>{$('#st').textContent='';alert('ผิดพลาด: '+e.message)})}
function load(){api('getAll').then(d=>{D=d;render()}).catch(e=>$('#app').textContent='โหลดไม่สำเร็จ: '+e.message)}
function go(p,id){page=p;pid=id||null;render()}
function render(){
 $('#nav').innerHTML=PAGES.map(([k,l])=>`<button class="${k===page||(k==='proj'&&page==='pd')?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 ({dash,proj,pd,tx,price})[page]();
}
/* ---------- Dashboard ---------- */
function dash(){
 const ps=D.Projects.filter(p=>p.status!=='ยกเลิก'),S=ps.map(stats),ids=ps.map(p=>p.id);
 const budget=ps.reduce((t,p)=>t+N(p.budget),0),spent=S.reduce((t,s)=>t+s.total,0),paid=S.reduce((t,s)=>t+s.paid,0),rec=S.reduce((t,s)=>t+s.rec,0);
 const act=ps.filter(p=>p.status==='กำลังดำเนินการ'||p.status==='รอดำเนินการ');
 const up=act.filter(p=>p.date>=today()).sort((a,b)=>a.date<b.date?-1:1).slice(0,5);
 const its=D.Items.filter(x=>ids.includes(x.projectId)),cat={};
 its.forEach(x=>{const k=x.main||'อื่นๆ';cat[k]=(cat[k]||0)+N(x.total)});
 const cs=Object.entries(cat).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]),mx=cs.length?cs[0][1]:1;
 const pend=its.filter(x=>x.status!=='Done').slice(0,8);
 $('#app').innerHTML=`<div class="grid">
 ${[['งานทั้งหมด',ps.length+' งาน'],['งานที่ยังไม่จบ',act.length+' งาน'],['งบรวมที่ได้รับ','฿'+fmt(budget)],['ค่าใช้จ่ายรวม','฿'+fmt(spent)],['จ่ายแล้ว','฿'+fmt(paid)],['ค้างจ่าย','฿'+fmt(spent-paid)],['รับเงินแล้ว','฿'+fmt(rec)],['ค้างรับ','฿'+fmt(budget-rec)],['กำไรโดยประมาณ','฿'+fmt(budget-spent)]].map(([a,b])=>`<div class="card stat"><small>${a}</small><b>${b}</b></div>`).join('')}</div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
 <div class="card"><h3 style="margin-top:0">งานที่กำลังจะถึง</h3>${up.map(p=>`<div class="row clk" onclick="go('pd','${p.id}')"><span>${esc(p.name)}<br><span class="mute">${esc(p.date)} · ${esc(p.venue)}</span></span><span class="tag">${esc(p.status)}</span></div>`).join('')||'<p class="mute">ไม่มีงานที่กำลังจะถึง</p>'}</div>
 <div class="card"><h3 style="margin-top:0">ค่าใช้จ่ายตามหมวด</h3>${cs.map(([k,v])=>`<div class="mute">${esc(k)} · ฿${fmt(v)}</div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`).join('')||'<p class="mute">ยังไม่มีข้อมูล</p>'}</div></div>
 <div class="card"><h3 style="margin-top:0">รายการที่ยังไม่เสร็จ (${its.filter(x=>x.status!=='Done').length})</h3>${pend.map(x=>`<div class="row"><span>${esc(x.name)}<br><span class="mute">${esc(pname(x.projectId))} · ${esc(x.main)}</span></span><span class="tag">${esc(x.status)}</span></div>`).join('')||'<p class="mute">ไม่มีรายการค้าง</p>'}</div>`;
}
/* ---------- Projects ---------- */
function proj(){
 const ps=[...D.Projects].sort((a,b)=>a.date<b.date?1:-1);
 $('#app').innerHTML=`<div class="bar2"><h3 style="margin:0">โปรเจ็คทั้งหมด (${ps.length})</h3><button class="p" onclick="openForm('Projects')">+ เพิ่มงาน</button></div>`+
 (ps.map(p=>{const s=stats(p),pc=N(p.budget)?s.spent/N(p.budget)*100:0;return`<div class="card clk" style="margin-bottom:10px" onclick="go('pd','${p.id}')"><div class="row" style="border:0;padding:0"><b>${esc(p.name)}</b><span class="tag">${esc(p.status)}</span></div><div class="mute">${esc(p.client)} · ${esc(p.date)} · ${esc(p.venue)}</div><div class="bar ${pc>100?'over':''}"><i style="width:${Math.min(pc,100)}%"></i></div><div class="mute">งบ ฿${fmt(p.budget)} · ค่าใช้จ่าย ฿${fmt(s.spent)} (จ่ายแล้ว ฿${fmt(s.paid)}) · <span class="${s.left<0?'bad':'ok'}">เหลือ ฿${fmt(s.left)}</span></div></div>`}).join('')||'<p class="mute">ยังไม่มีงาน กด "+ เพิ่มงาน"</p>');
}
function pd(){
 const p=D.Projects.find(x=>x.id===pid);if(!p)return go('proj');const s=stats(p);
 $('#app').innerHTML=`<div class="bar2"><button class="g" onclick="go('proj')">← กลับ</button><span><button class="g" onclick="openForm('Projects','${p.id}')">แก้ไข</button> <button class="g" onclick="del('Projects','${p.id}')">ลบ</button></span></div>
 <div class="card"><h3 style="margin:0">${esc(p.name)} <span class="tag">${esc(p.status)}</span></h3><div class="mute">ลูกค้า: ${esc(p.client)} · วันงาน: ${esc(p.date)} · สถานที่: ${esc(p.venue)}</div><p>${esc(p.note).replace(/\n/g,'<br>')}</p></div>
 <div class="grid" style="margin-top:10px">${[['งบที่ได้รับ',p.budget],['ค่าใช้จ่ายรวม',s.total],['จ่ายแล้ว',s.paid],['ค้างจ่าย',s.total-s.paid],['เหลือจากงบ',s.left],['รับเงินแล้ว',s.rec],['ค้างรับ',N(p.budget)-s.rec]].map(([a,b])=>`<div class="card stat"><small>${a}</small><b>฿${fmt(b)}</b></div>`).join('')}</div>
 <div class="bar2"><h3 style="margin:0">รายการจัดซื้อ</h3><span><button class="g" onclick="openForm('Budgets',null,{projectId:'${p.id}'})">+ ตั้งงบหมวด</button> <button class="p" onclick="openForm('Items',null,{projectId:'${p.id}'})">+ เพิ่มรายการ</button></span></div>${itemsView(p.id)}
 <div class="bar2"><h3 style="margin:0">เงินที่รับจากลูกค้า</h3><button class="p" onclick="openForm('Transactions',null,{projectId:'${p.id}'})">+ บันทึกรับเงิน</button></div>
 <div class="card">${s.inc.map(x=>`<div class="row"><span>${esc(x.desc)}<br><span class="mute">${esc(x.date)}</span></span><span><b class="ok">+${fmt(x.amount)}</b> <button class="g" onclick="openForm('Transactions','${x.id}')">แก้</button></span></div>`).join('')||'<p class="mute">ยังไม่มีรายการ</p>'}</div>`;
}
/* ---------- Items (รายการจัดซื้อ) ---------- */
function itemsView(id){
 const it=D.Items.filter(x=>x.projectId===id),bg=D.Budgets.filter(x=>x.projectId===id);
 const mains=[...new Set([...it.map(x=>x.main||'อื่นๆ'),...bg.map(x=>x.main)])];
 return mains.map(m=>{
  const a=it.filter(x=>(x.main||'อื่นๆ')===m),b=bg.find(x=>x.main===m),t=sk(a,'total'),pa=sk(a,'paid');
  return `<div class="card" style="margin-bottom:10px"><div class="bar2" style="margin:0 0 6px"><b>${esc(m)}</b><span class="mute">รวม ฿${fmt(t)} · จ่ายแล้ว ฿${fmt(pa)}${b?` · งบ ฿${fmt(b.amount)} <span class="${t>N(b.amount)?'bad':'ok'}">(เหลือ ${fmt(N(b.amount)-t)})</span> <a href="#" onclick="openForm('Budgets','${b.id}');return false">แก้งบ</a>`:''}</span></div>
  <div class="wrap"><table><tr><th>รายการ</th><th>จำนวน</th><th class="r">ราคา/หน่วย</th><th class="r">รวม</th><th>สถานะ</th><th class="r">จ่ายแล้ว</th><th></th></tr>${a.map(x=>`<tr><td>${x.image?`<img src="${esc(x.image)}" style="width:34px;height:34px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px">`:''}${esc(x.name)}<br><span class="mute">${esc(x.detail)} ${esc(x.remark)}</span></td><td>${esc(x.qty)} ${esc(x.unit)}</td><td class="r">${fmt(x.price)}</td><td class="r">${fmt(x.total)}</td><td><select onchange="setSt('${x.id}',this.value)" style="padding:4px;width:auto">${ST.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td><td class="r ${N(x.total)&&N(x.paid)>=N(x.total)?'ok':''}">${fmt(x.paid)}</td><td class="r" style="white-space:nowrap"><button class="g" title="จ่ายครบ" onclick="payAll('${x.id}')">✓</button> <button class="g" onclick="openForm('Items','${x.id}')">แก้</button></td></tr>`).join('')||'<tr><td colspan="7" class="mute">ยังไม่มีรายการในหมวดนี้</td></tr>'}</table></div></div>`;
 }).join('')||'<p class="mute">ยังไม่มีรายการ กด "+ เพิ่มรายการ"</p>';
}
function setSt(id,v){const o=Object.assign({},D.Items.find(x=>x.id===id));o.status=v;run('saveRow','Items',o)}
function payAll(id){const o=Object.assign({},D.Items.find(x=>x.id===id));o.paid=N(o.total);run('saveRow','Items',o)}
function tx(){
 if(!D.Projects.find(p=>p.id===txf))txf=(D.Projects[0]||{}).id||'';
 if(!txf){$('#app').innerHTML='<p class="mute">ยังไม่มีโปรเจ็ค กรุณาเพิ่มงานก่อน</p>';return}
 const s=stats(D.Projects.find(p=>p.id===txf));
 $('#app').innerHTML=`<div class="bar2"><select style="max-width:260px" onchange="txf=this.value;tx()">${D.Projects.map(p=>`<option value="${p.id}" ${p.id===txf?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span><button class="g" onclick="openForm('Budgets',null,{projectId:'${txf}'})">+ ตั้งงบหมวด</button> <button class="p" onclick="openForm('Items',null,{projectId:'${txf}'})">+ เพิ่มรายการ</button></span></div>
 <div class="grid">${[['รวมทั้งหมด',s.total],['จ่ายแล้ว',s.paid],['ค้างจ่าย',s.total-s.paid]].map(([a,b])=>`<div class="card stat"><small>${a}</small><b>฿${fmt(b)}</b></div>`).join('')}</div>${itemsView(txf)}`;
}
/* ---------- Prices ---------- */
let PM={shops:[],rows:[]};
const rng=x=>{const m=String(x.note||'').match(/ช่วงราคา\s*([\d.,]+\s*-\s*[\d.,]+)/);return m?m[1].replace(/\s/g,''):''};
const low=(r,shops)=>{const v=shops.map(s=>r.c[s]).filter(Boolean);return v.length?v.reduce((a,b)=>N(b.price)<N(a.price)?b:a):null};
function pmatrix(){
 const k=q.trim().toLowerCase(),PREF=['Dee dee','Flowerland','Worldflower','555','NNP'];
 const all=[...new Set(D.Prices.map(x=>x.shop))];
 const shops=[...PREF.filter(s=>all.includes(s)),...all.filter(s=>!PREF.includes(s)&&s!=='ไม่ระบุร้าน'),...all.filter(s=>s==='ไม่ระบุร้าน')];
 const map=new Map();
 D.Prices.filter(x=>!k||[x.item,x.color,x.shop,x.note].join(' ').toLowerCase().includes(k)).forEach(x=>{
  const key=[x.item,x.color,x.unit].map(v=>String(v==null?'':v).trim()).join('|');
  if(!map.has(key))map.set(key,{item:x.item,color:x.color||'',unit:x.unit||'',c:{}});
  const r=map.get(key),cur=r.c[x.shop];if(!cur||N(x.price)<N(cur.price))r.c[x.shop]=x;
 });
 return{shops,rows:[...map.values()]};
}
function price(){
 $('#app').innerHTML=`<div class="bar2"><input id="q" style="flex:1;min-width:180px" placeholder="🔍 ค้นหาดอกไม้ / สินค้า เช่น กุหลาบ" value="${esc(q)}" oninput="q=this.value;plist()"><button class="p" onclick="openForm('Prices')">+ เพิ่มราคา</button></div>
 <div class="card"><div class="bar2" style="align-items:flex-start"><div><h3 style="margin:0">Supplier Price List</h3><div class="mute">เทียบราคาแต่ละร้าน — ตรวจสอบหน่วยและราคาก่อนสั่งซื้อ · กดที่ราคาเพื่อแก้ไข กด — เพื่อเพิ่มราคา</div></div><button class="g" onclick="exportCsv()">⇩ Export CSV</button></div><div id="pl"></div></div>`;
 plist();
}
function plist(){
 PM=pmatrix();const{shops,rows}=PM;
 $('#pl').innerHTML=rows.length?`<div class="wrap"><table class="pt"><tr><th>Flower</th><th>Color / Type</th>${shops.map(s=>`<th>${esc(s)}</th>`).join('')}<th>ราคาต่ำสุด</th></tr>${rows.map((r,ri)=>{const m=low(r,shops);return`<tr><td><b>${esc(r.item)}</b></td><td>${esc(r.color)}${r.unit?` <span class="mute">(${esc(r.unit)})</span>`:''}</td>${shops.map((s,si)=>{const x=r.c[s];return x?`<td class="pc" onclick="openForm('Prices','${x.id}')">${rng(x)?`<span class="rg">${rng(x)}</span>`:fmt(x.price)}</td>`:`<td class="pc e" onclick="addPrice(${ri},${si})">—</td>`}).join('')}<td>${m?`<span class="low">฿${fmt(m.price)}</span><br><span class="mute" style="font-size:11px">${esc(m.shop)}</span>`:'—'}</td></tr>`}).join('')}</table></div>`:'<p class="mute">ไม่พบข้อมูล — กด "+ เพิ่มราคา" เพื่อบันทึกราคาจากแต่ละร้าน</p>';
}
function addPrice(ri,si){const r=PM.rows[ri];openForm('Prices',null,{item:r.item,color:r.color,unit:r.unit,shop:PM.shops[si]})}
function exportCsv(){
 const{shops,rows}=PM,q2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const L=[['Flower','Color / Type',...shops,'ราคาต่ำสุด','ร้านที่ถูกสุด'].map(q2).join(',')];
 rows.forEach(r=>{const m=low(r,shops);L.push([r.item,r.color+(r.unit?' ('+r.unit+')':''),...shops.map(s=>r.c[s]?(rng(r.c[s])||r.c[s].price):''),m?m.price:'',m?m.shop:''].map(q2).join(','))});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='supplier-price-list.csv';a.click();
}
/* ---------- Form ---------- */
function openForm(kind,id,pre){
 const r=id?D[kind].find(x=>x.id===id):Object.assign({date:today(),type:'รายจ่าย'},pre||{});
 const fld=([k,l,t,o])=>{const v=r[k]==null?'':r[k];let i;
  if(t==='select')i=`<select id="f_${k}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
  else if(t==='project')i=`<select id="f_${k}"><option value="">- เลือกงาน -</option>${D.Projects.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
  else if(t==='main')i=`<input id="f_${k}" list="mains" value="${esc(v)}"><datalist id="mains">${[...new Set([...MAINS,...D.Items.map(x=>x.main),...D.Budgets.map(x=>x.main)])].filter(Boolean).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  else if(t==='textarea')i=`<textarea id="f_${k}" rows="3">${esc(v)}</textarea>`;
  else i=`<input id="f_${k}" type="${t||'text'}" ${t==='number'?'inputmode="decimal" step="any"':''} value="${esc(v)}">`;
  return`<label>${l}</label>${i}`};
 $('#modal').innerHTML=`<div class="bd" onclick="if(event.target===this)closeM()"><div class="md"><b>${id?'แก้ไข':'เพิ่ม'}</b>${F[kind].map(fld).join('')}<div class="bar2" style="margin:16px 0 0"><span>${id?`<button class="g" onclick="del('${kind}','${id}')">ลบ</button>`:''}</span><span><button class="g" onclick="closeM()">ยกเลิก</button> <button class="p" onclick="save('${kind}','${id||''}')">บันทึก</button></span></div></div></div>`;
}
function closeM(){$('#modal').innerHTML=''}
function save(kind,id){
 const o=id?Object.assign({},D[kind].find(x=>x.id===id)):{};
 F[kind].forEach(([k,,t])=>{const v=$('#f_'+k).value;o[k]=t==='number'?N(v):v});
 if(kind==='Projects'&&!o.name)return alert('กรุณาใส่ชื่องาน');
 if(kind==='Items'){if(!o.projectId||!o.name)return alert('กรุณาเลือกงานและใส่ชื่อรายการ');o.main=o.main||'อื่นๆ';o.qty=o.qty||'';if(!o.total)o.total=(o.qty||1)*N(o.price)}
 if(kind==='Budgets'&&(!o.projectId||!o.main||!o.amount))return alert('กรุณาเลือกงาน หมวด และใส่งบ');
 if(kind==='Transactions'){if(!o.projectId||!o.amount)return alert('กรุณาเลือกงานและใส่จำนวนเงิน');o.type='รายรับ'}
 if(kind==='Prices'&&(!o.item||!o.shop||!o.price))return alert('กรุณาใส่สินค้า ร้าน และราคา');
 closeM();run('saveRow',kind,o);
}
function del(kind,id){if(!confirm('ลบรายการนี้?'))return;closeM();if(kind==='Projects')page='proj';run('deleteRow',kind,id)}
load();
</script></body></html>
