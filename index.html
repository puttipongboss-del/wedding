<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<style>
:root{--bg:#faf6f3;--card:#fff;--ink:#2b2326;--mute:#8a7d80;--line:#eadfdc;--pri:#b4536b;--pri2:#f6e3e8;--ok:#2f8f5b;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}.top b{color:var(--pri);font-size:18px}
nav{display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:20px;font:inherit;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat small{color:var(--mute);display:block}.stat b{font-size:22px}
h3{margin:18px 0 8px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.mute{color:var(--mute);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--pri2);border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--pri)}
.bar.over i{background:var(--bad)}
button.p{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.g{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.tag{font-size:12px;background:var(--pri2);color:var(--pri);padding:2px 8px;border-radius:10px}
.tag.best{background:#dff3e7;color:var(--ok)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
.bd{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.md{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.bar2{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.clk{cursor:pointer}.clk:hover{border-color:var(--pri)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--mute);font-weight:500}.r{text-align:right}
.wrap{overflow-x:auto}
</style></head><body>
<header><div class="top"><b>💐 บัญชีงานแต่ง</b><span class="mute" id="st"></span></div>
<nav id="nav"></nav></header>
<main id="app">กำลังโหลด...</main>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const PAGES=[['dash','📊 Dashboard'],['proj','💍 โปรเจ็ค'],['tx','🧾 รายรับ-รายจ่าย'],['price','🌸 ราคาสินค้า']];
const CATS=['ดอกไม้','ตกแต่ง/เวที','อาหาร/เครื่องดื่ม','ช่างภาพ/วิดีโอ','ดนตรี/MC','ชุด/แต่งหน้า','ขนส่ง','ค่าแรงทีมงาน','อื่นๆ'];
const F={
 Projects:[['name','ชื่องาน'],['client','ลูกค้า'],['date','วันงาน','date'],['venue','สถานที่'],['budget','งบ/ค่าจ้างที่ได้รับ (บาท)','number'],['status','สถานะ','select',['รอดำเนินการ','กำลังดำเนินการ','เสร็จสิ้น','ยกเลิก']],['note','รายละเอียด','textarea']],
 Transactions:[['date','วันที่','date'],['projectId','โปรเจ็ค','project'],['type','ประเภท','select',['รายจ่าย','รายรับ']],['category','หมวด','select',CATS],['desc','รายการ'],['amount','จำนวนเงิน (บาท)','number'],['vendor','ร้าน/ผู้รับเงิน']],
 Prices:[['item','สินค้า/ดอกไม้'],['unit','หน่วย (เช่น มัด, ก้าน, ชิ้น)'],['shop','ร้าน'],['price','ราคา (บาท)','number'],['date','วันที่เช็คราคา','date'],['note','หมายเหตุ']]
};
let D={Projects:[],Transactions:[],Prices:[]},page='dash',pid=null,txf='',q='';
const N=x=>Number(x)||0,fmt=n=>N(n).toLocaleString('th-TH'),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=a=>a.reduce((t,x)=>t+N(x.amount),0);
const pname=id=>(D.Projects.find(p=>p.id===id)||{}).name||'-';
function stats(p){const t=D.Transactions.filter(x=>x.projectId===p.id);const spent=sum(t.filter(x=>x.type==='รายจ่าย')),rec=sum(t.filter(x=>x.type==='รายรับ'));return{spent,rec,left:N(p.budget)-spent,t}}
const API='https://script.google.com/macros/s/AKfycbyBSpa9_9s4wIMx3WavPO_sP7xSwlTi9fRS0XZGwfqt2VMnDltBDoOVexNrvXoUsbc8KQ/exec';
let KEY=localStorage.getItem('wk')||'';
async function api(action,p){
 if(!KEY)KEY=prompt('ใส่รหัสผ่านเข้าใช้งาน')||'';
 const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:KEY,action},p||{}))});
 const j=await res.json();
 if(!j.ok){if(/รหัสผ่าน/.test(j.error)){KEY='';localStorage.removeItem('wk')}throw new Error(j.error)}
 localStorage.setItem('wk',KEY);return j.data;
}
function run(fn,...a){$('#st').textContent='กำลังบันทึก...';api(fn,fn==='saveRow'?{sheet:a[0],row:a[1]}:{sheet:a[0],id:a[1]}).then(d=>{D=d;$('#st').textContent='';render()}).catch(e=>{$('#st').textContent='';alert('ผิดพลาด: '+e.message)})}
function load(){api('getAll').then(d=>{D=d;render()}).catch(e=>$('#app').textContent='โหลดไม่สำเร็จ: '+e.message)}
function go(p,id){page=p;pid=id||null;render()}
function render(){
 $('#nav').innerHTML=PAGES.map(([k,l])=>`<button class="${k===page||(k==='proj'&&page==='pd')?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 ({dash,proj,pd,tx,price})[page]();
}
/* ---------- Dashboard ---------- */
function dash(){
 const ps=D.Projects.filter(p=>p.status!=='ยกเลิก'),S=ps.map(stats);
 const budget=ps.reduce((t,p)=>t+N(p.budget),0),spent=S.reduce((t,s)=>t+s.spent,0),rec=S.reduce((t,s)=>t+s.rec,0);
 const act=ps.filter(p=>p.status==='กำลังดำเนินการ'||p.status==='รอดำเนินการ');
 const up=act.filter(p=>p.date>=today()).sort((a,b)=>a.date<b.date?-1:1).slice(0,5);
 const cat={};D.Transactions.filter(x=>x.type==='รายจ่าย').forEach(x=>cat[x.category||'อื่นๆ']=(cat[x.category||'อื่นๆ']||0)+N(x.amount));
 const cs=Object.entries(cat).sort((a,b)=>b[1]-a[1]),mx=cs.length?cs[0][1]:1;
 const rc=[...D.Transactions].sort((a,b)=>a.date<b.date?1:-1).slice(0,8);
 $('#app').innerHTML=`<div class="grid">
 ${[['งานทั้งหมด',ps.length+' งาน'],['งานที่ยังไม่จบ',act.length+' งาน'],['งบรวมที่ได้รับ','฿'+fmt(budget)],['ใช้จ่ายแล้ว','฿'+fmt(spent)],['รับเงินแล้ว','฿'+fmt(rec)],['ค้างรับ','฿'+fmt(budget-rec)],['กำไรโดยประมาณ','฿'+fmt(budget-spent)]].map(([a,b])=>`<div class="card stat"><small>${a}</small><b>${b}</b></div>`).join('')}</div>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
 <div class="card"><h3 style="margin-top:0">งานที่กำลังจะถึง</h3>${up.map(p=>`<div class="row clk" onclick="go('pd','${p.id}')"><span>${esc(p.name)}<br><span class="mute">${esc(p.date)} · ${esc(p.venue)}</span></span><span class="tag">${esc(p.status)}</span></div>`).join('')||'<p class="mute">ไม่มีงานที่กำลังจะถึง</p>'}</div>
 <div class="card"><h3 style="margin-top:0">ค่าใช้จ่ายตามหมวด</h3>${cs.map(([k,v])=>`<div class="mute">${esc(k)} · ฿${fmt(v)}</div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`).join('')||'<p class="mute">ยังไม่มีข้อมูล</p>'}</div></div>
 <div class="card"><h3 style="margin-top:0">รายการล่าสุด</h3>${rc.map(x=>`<div class="row"><span>${esc(x.desc)}<br><span class="mute">${esc(x.date)} · ${esc(pname(x.projectId))}</span></span><b class="${x.type==='รายรับ'?'ok':'bad'}">${x.type==='รายรับ'?'+':'-'}${fmt(x.amount)}</b></div>`).join('')||'<p class="mute">ยังไม่มีรายการ</p>'}</div>`;
}
/* ---------- Projects ---------- */
function proj(){
 const ps=[...D.Projects].sort((a,b)=>a.date<b.date?1:-1);
 $('#app').innerHTML=`<div class="bar2"><h3 style="margin:0">โปรเจ็คทั้งหมด (${ps.length})</h3><button class="p" onclick="openForm('Projects')">+ เพิ่มงาน</button></div>`+
 (ps.map(p=>{const s=stats(p),pc=N(p.budget)?s.spent/N(p.budget)*100:0;return`<div class="card clk" style="margin-bottom:10px" onclick="go('pd','${p.id}')"><div class="row" style="border:0;padding:0"><b>${esc(p.name)}</b><span class="tag">${esc(p.status)}</span></div><div class="mute">${esc(p.client)} · ${esc(p.date)} · ${esc(p.venue)}</div><div class="bar ${pc>100?'over':''}"><i style="width:${Math.min(pc,100)}%"></i></div><div class="mute">งบ ฿${fmt(p.budget)} · ใช้ ฿${fmt(s.spent)} · <span class="${s.left<0?'bad':'ok'}">เหลือ ฿${fmt(s.left)}</span></div></div>`}).join('')||'<p class="mute">ยังไม่มีงาน กด "+ เพิ่มงาน"</p>');
}
function pd(){
 const p=D.Projects.find(x=>x.id===pid);if(!p)return go('proj');const s=stats(p);
 $('#app').innerHTML=`<div class="bar2"><button class="g" onclick="go('proj')">← กลับ</button><span><button class="g" onclick="openForm('Projects','${p.id}')">แก้ไข</button> <button class="g" onclick="del('Projects','${p.id}')">ลบ</button></span></div>
 <div class="card"><h3 style="margin:0">${esc(p.name)} <span class="tag">${esc(p.status)}</span></h3><div class="mute">ลูกค้า: ${esc(p.client)} · วันงาน: ${esc(p.date)} · สถานที่: ${esc(p.venue)}</div><p>${esc(p.note).replace(/\n/g,'<br>')}</p></div>
 <div class="grid" style="margin-top:10px">${[['งบที่ได้รับ',p.budget],['ใช้ไป',s.spent],['เหลือ',s.left],['รับเงินแล้ว',s.rec],['ค้างรับ',N(p.budget)-s.rec]].map(([a,b])=>`<div class="card stat"><small>${a}</small><b>฿${fmt(b)}</b></div>`).join('')}</div>
 <div class="bar2"><h3 style="margin:0">รายการของงานนี้</h3><button class="p" onclick="openForm('Transactions',null,{projectId:'${p.id}'})">+ เพิ่มรายการ</button></div>${txTable(s.t,false)}`;
}
/* ---------- Transactions ---------- */
function txTable(t,showP){
 t=[...t].sort((a,b)=>a.date<b.date?1:-1);
 return `<div class="card wrap"><table><tr><th>วันที่</th>${showP?'<th>งาน</th>':''}<th>รายการ</th><th>หมวด</th><th class="r">จำนวน</th><th></th></tr>${t.map(x=>`<tr><td>${esc(x.date)}</td>${showP?`<td>${esc(pname(x.projectId))}</td>`:''}<td>${esc(x.desc)}<br><span class="mute">${esc(x.vendor)}</span></td><td>${esc(x.category)}</td><td class="r ${x.type==='รายรับ'?'ok':'bad'}">${x.type==='รายรับ'?'+':'-'}${fmt(x.amount)}</td><td class="r"><button class="g" onclick="openForm('Transactions','${x.id}')">แก้</button></td></tr>`).join('')||'<tr><td colspan="6" class="mute">ยังไม่มีรายการ</td></tr>'}</table></div>`;
}
function tx(){
 const t=D.Transactions.filter(x=>!txf||x.projectId===txf);
 $('#app').innerHTML=`<div class="bar2"><select style="max-width:240px" onchange="txf=this.value;tx()"><option value="">ทุกโปรเจ็ค</option>${D.Projects.map(p=>`<option value="${p.id}" ${p.id===txf?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button class="p" onclick="openForm('Transactions',null,{projectId:txf})">+ เพิ่มรายการ</button></div>
 <div class="grid"><div class="card stat"><small>รายรับ</small><b class="ok">฿${fmt(sum(t.filter(x=>x.type==='รายรับ')))}</b></div><div class="card stat"><small>รายจ่าย</small><b class="bad">฿${fmt(sum(t.filter(x=>x.type==='รายจ่าย')))}</b></div></div>`+txTable(t,true);
}
/* ---------- Prices ---------- */
function price(){
 $('#app').innerHTML=`<div class="bar2"><input id="q" style="flex:1;min-width:180px" placeholder="🔍 ค้นหาดอกไม้ / สินค้า เช่น กุหลาบ" value="${esc(q)}" oninput="q=this.value;plist()"><button class="p" onclick="openForm('Prices')">+ เพิ่มราคา</button></div><div id="pl"></div>`;plist();
}
function plist(){
 const k=q.trim().toLowerCase(),g={};
 D.Prices.filter(x=>!k||(x.item+x.shop+x.note).toLowerCase().includes(k)).forEach(x=>{const key=String(x.item).trim().toLowerCase()+'|'+String(x.unit).trim();(g[key]=g[key]||[]).push(x)});
 $('#pl').innerHTML=Object.values(g).map(a=>{a.sort((x,y)=>N(x.price)-N(y.price));const b=a[0];return`<div class="card" style="margin-bottom:10px"><div class="row" style="border:0;padding:0"><b>${esc(b.item)} <span class="mute">/ ${esc(b.unit)}</span></b><span class="tag best">ถูกสุด: ${esc(b.shop)} ฿${fmt(b.price)}</span></div>${a.map((x,i)=>`<div class="row"><span>${esc(x.shop)} <span class="mute">${esc(x.date)} ${esc(x.note)}</span></span><span><b class="${i?'':'ok'}">฿${fmt(x.price)}</b> <button class="g" onclick="openForm('Prices','${x.id}')">แก้</button></span></div>`).join('')}</div>`}).join('')||'<p class="mute">ไม่พบข้อมูล — กด "+ เพิ่มราคา" เพื่อบันทึกราคาจากแต่ละร้าน</p>';
}
/* ---------- Form ---------- */
function openForm(kind,id,pre){
 const r=id?D[kind].find(x=>x.id===id):Object.assign({date:today(),type:'รายจ่าย'},pre||{});
 const fld=([k,l,t,o])=>{const v=r[k]==null?'':r[k];let i;
  if(t==='select')i=`<select id="f_${k}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
  else if(t==='project')i=`<select id="f_${k}"><option value="">- เลือกงาน -</option>${D.Projects.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
  else if(t==='textarea')i=`<textarea id="f_${k}" rows="3">${esc(v)}</textarea>`;
  else i=`<input id="f_${k}" type="${t||'text'}" ${t==='number'?'inputmode="decimal" step="any"':''} value="${esc(v)}">`;
  return`<label>${l}</label>${i}`};
 $('#modal').innerHTML=`<div class="bd" onclick="if(event.target===this)closeM()"><div class="md"><b>${id?'แก้ไข':'เพิ่ม'}</b>${F[kind].map(fld).join('')}<div class="bar2" style="margin:16px 0 0"><span>${id?`<button class="g" onclick="del('${kind}','${id}')">ลบ</button>`:''}</span><span><button class="g" onclick="closeM()">ยกเลิก</button> <button class="p" onclick="save('${kind}','${id||''}')">บันทึก</button></span></div></div></div>`;
}
function closeM(){$('#modal').innerHTML=''}
function save(kind,id){
 const o=id?Object.assign({},D[kind].find(x=>x.id===id)):{};
 F[kind].forEach(([k,,t])=>{const v=$('#f_'+k).value;o[k]=t==='number'?N(v):v});
 if(kind==='Projects'&&!o.name)return alert('กรุณาใส่ชื่องาน');
 if(kind==='Transactions'&&(!o.projectId||!o.amount))return alert('กรุณาเลือกงานและใส่จำนวนเงิน');
 if(kind==='Prices'&&(!o.item||!o.shop||!o.price))return alert('กรุณาใส่สินค้า ร้าน และราคา');
 closeM();run('saveRow',kind,o);
}
function del(kind,id){if(!confirm('ลบรายการนี้?'))return;closeM();if(kind==='Projects')page='proj';run('deleteRow',kind,id)}
load();
</script></body></html>
